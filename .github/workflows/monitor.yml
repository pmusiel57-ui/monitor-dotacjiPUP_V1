name: Monitor dotacji

on:
  schedule:
    # GitHub liczy czas w UTC. 6:00 UTC = 8:00 latem, 7:00 UTC = 8:00 zimą.
    # Skrypt sam pilnuje, żeby sprawdzić strony tylko raz dziennie, od 8:00.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: # przycisk "Run workflow" – uruchamia od razu, o każdej porze

permissions:
  contents: write # potrzebne do zapisania bazy data/monitor.db w repozytorium

concurrency:
  group: monitor-dotacji
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja bibliotek
        run: pip install -r requirements.txt

      - name: Sprawdzenie stron
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python checker.py

      - name: Zapis bazy w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/monitor.db
          if git diff --cached --quiet; then
            echo "Baza bez zmian."
          else
            git commit -m "Aktualizacja bazy monitora [skip ci]"
            git push
          fi
